<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Universal Trade Profiler</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f17; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between font-sans">
    <header class="mb-5 text-center border-b border-gray-800 pb-3">
        <h1 class="text-xl font-black text-emerald-400 tracking-wide uppercase">Universal Broker Profiler</h1>
        <p class="text-[10px] text-gray-400 mt-0.5">Compatible with easyMarkets App, MT4, & MT5 Exports</p>
    </header>
    <div class="mb-5 bg-gray-900 p-4 rounded-xl border border-gray-800 text-center">
        <label class="block cursor-pointer">
            <span class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 mb-2">Import App History File</span>
            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="runLocalAnalysis()">
            <span id="uiEngineButton" class="inline-block bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-md transition-all">Choose CSV File</span>
        </label>
    </div>
    <main class="flex-1 space-y-4">
        <div class="bg-gray-900 p-5 rounded-2xl text-center border border-gray-850 shadow-xl">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest font-bold block mb-1">Calculated Net Return</span>
            <div id="metricNetPnl" class="text-3xl font-black tracking-tight text-gray-400">$0.00</div>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-900 p-3.5 rounded-xl text-center border border-gray-850">
                <span class="text-[9px] uppercase font-bold text-gray-400 block mb-0.5">Win Rate</span>
                <span id="metricWinRate" class="text-base font-black text-emerald-400">0.0%</span>
            </div>
            <div class="bg-gray-900 p-3.5 rounded-xl text-center border border-gray-850">
                <span class="text-[9px] uppercase font-bold text-gray-400 block mb-0.5">Profit Factor</span>
                <span id="metricProfitFactor" class="text-base font-black text-blue-400">0.00</span>
            </div>
            <div class="bg-gray-900 p-3.5 rounded-xl text-center border border-gray-850">
                <span class="text-[9px] uppercase font-bold text-gray-400 block mb-0.5">Average Win</span>
                <span id="metricAvgWin" class="text-xs font-bold text-emerald-500">$0.00</span>
            </div>
            <div class="bg-gray-900 p-3.5 rounded-xl text-center border border-gray-850">
                <span class="text-[9px] uppercase font-bold text-gray-400 block mb-0.5">Average Loss</span>
                <span id="metricAvgLoss" class="text-xs font-bold text-red-500">$0.00</span>
            </div>
        </div>
        <div class="bg-gray-900/40 px-4 py-2.5 rounded-xl flex justify-between items-center text-[11px] text-gray-400 border border-gray-850">
            <span>Parsed Records: <strong id="metaCount" class="text-white">0</strong></span>
            <span>Data Format: <strong id="metaDetection" class="text-yellow-400">None Loaded</strong></span>
        </div>
    </main>
    <footer class="mt-5 text-center text-[9px] text-gray-500 tracking-tight">Client-side analytics engine. Data remains local to your device container.</footer>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Active")).catch(err => console.log(err));
        }
        function runLocalAnalysis() {
            const inputTarget = document.getElementById('csvFileInput');
            const actionButton = document.getElementById('uiEngineButton');
            if (!inputTarget.files || inputTarget.files.length === 0) return;
            actionButton.textContent = "Parsing File...";
            const fileReader = new FileReader();
            fileReader.onload = function (event) { processRawCSVText(event.target.result); };
            fileReader.readAsText(inputTarget.files);
        }
       function processRawCSVText(rawText) {
    const entryRows = rawText.split(/\r?\n/).map(row => row.trim()).filter(row => row.length > 0);
    if (entryRows.length < 2) {
        alert("File standard fault: Insufficient row count detected.");
        resetEngineUI();
        return;
    }

    const primaryHeaders = entryRows[0].toLowerCase().split(',').map(item => item.replace(/["']/g, "").trim());
    
    const pnlKeywords = ['profit', 'pnl', 'p&l', 'amount', 'net return', 'realized', 'gain', 'loss'];
    
    let mappedPnlIndex = -1;

    for (let index = 0; index < primaryHeaders.length; index++) {
        const headerValue = primaryHeaders[index];
        if (pnlKeywords.some(keyword => headerValue.includes(keyword))) {
            mappedPnlIndex = index;
            break;
        }
    }

    if (mappedPnlIndex === -1) {
        alert("Header Mapping Fault: Could not identify performance columns (e.g., Profit or Amount) in your easyMarkets file.");
        resetEngineUI();
        return;
    }

    let tradeExecutionCounter = 0;
    let profitableCounter = 0;
    let grossAssetGains = 0;
    let grossAssetLosses = 0;

    for (let i = 1; i < entryRows.length; i++) {
        const dataColumns = entryRows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.replace(/["']/g, "").trim());
        
        if (dataColumns.length <= mappedPnlIndex) continue;

        const rawPnlValue = parseFloat(dataColumns[mappedPnlIndex]);

        if (!isNaN(rawPnlValue)) {
            tradeExecutionCounter++;
            if (rawPnlValue > 0) {
                profitableCounter++;
                grossAssetGains += rawPnlValue;
            } else {
                grossAssetLosses += Math.abs(rawPnlValue);
            }
        }
    }

    if (tradeExecutionCounter === 0) {
        alert("Processing Fault: No numeric trade instances localized from target columns.");
        resetEngineUI();
        return;
    }

    const totalNetPnl = grossAssetGains - grossAssetLosses;
    const absoluteWinRate = (profitableCounter / tradeExecutionCounter) * 100;
    const absoluteProfitFactor = grossAssetLosses > 0 ? (grossAssetGains / grossAssetLosses) : grossAssetGains > 0 ? 99.9 : 0;
    const finalAverageWin = profitableCounter > 0 ? (grossAssetGains / profitableCounter) : 0;
    const finalAverageLoss = (tradeExecutionCounter - profitableCounter) > 0 ? (grossAssetLosses / (tradeExecutionCounter - profitableCounter)) : 0;

    document.getElementById('metaCount').textContent = tradeExecutionCounter;
    document.getElementById('metaDetection').textContent = primaryHeaders.includes('ticket') ? "MetaTrader Format" : "easyMarkets App Format";
    document.getElementById('metricWinRate').textContent = `${absoluteWinRate.toFixed(1)}%`;
    document.getElementById('metricProfitFactor').textContent = absoluteProfitFactor.toFixed(2);
    document.getElementById('metricAvgWin').textContent = `$${finalAverageWin.toFixed(2)}`;
    document.getElementById('metricAvgLoss').textContent = `$${finalAverageLoss.toFixed(2)}`;

    const uiNetValueBlock = document.getElementById('metricNetPnl');
    uiNetValueBlock.textContent = (totalNetPnl >= 0 ? '+' : '') + `$${totalNetPnl.toFixed(2)}`;
    uiNetValueBlock.className = `text-3xl font-black tracking-tight mt-1 ${totalNetPnl >= 0 ? 'text-emerald-400' : 'text-red-500'}`;

    const actionButton = document.getElementById('uiEngineButton');
    actionButton.textContent = "Data Synced";
    actionButton.className = "inline-block bg-emerald-600 text-white text-xs font-bold py-2 px-4 rounded-lg";
}
